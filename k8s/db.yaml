apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS generators (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(50),
        location VARCHAR(50),
        voltage INT DEFAULT 230,
        frequency DECIMAL(4,1) DEFAULT 50.0,
        load_kw DECIMAL(5,2) DEFAULT 0.00
    );

    INSERT INTO generators (name, location, voltage, frequency, load_kw)
    SELECT 'K8s-Gen-1', 'London', 232, 50.0, 110.5
    WHERE NOT EXISTS (
        SELECT 1 FROM generators WHERE name = 'K8s-Gen-1'
    );

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mariadb:10.6
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: rootpass
        - name: MYSQL_DATABASE
          value: webnet
        - name: MYSQL_USER
          value: webuser
        - name: MYSQL_PASSWORD
          value: Webnet123!
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
        - name: db-init
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: db-pvc
      - name: db-init
        configMap:
          name: db-init-script

---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
  - port: 3306
    targetPort: 3306

services:

  db:
    image: mariadb:11
    container_name: webnet-db

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: webnet
      MYSQL_USER: webuser
      MYSQL_PASSWORD: Webnet123!

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: webnet-app

    depends_on:
      - db

    ports:
      - "8080:80"

    environment:
      DB_HOST: db
      DB_USER: webuser
      DB_PASS: Webnet123!
      DB_NAME: webnet

volumes:
  db_data:
